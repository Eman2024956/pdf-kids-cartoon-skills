<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
@font-face{font-family:KidsFont;src:url(data:font/woff2;base64,__FONT_AR__) format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F,U+060C,U+061B,U+061F,U+0640;font-weight:800}
@font-face{font-family:KidsFont;src:url(data:font/woff2;base64,__FONT_LATIN__) format('woff2');font-weight:800}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1d1e33;font-family:KidsFont,system-ui,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;border-radius:28px;background:#fff}
body.record #stage{border-radius:0}
#art{position:absolute;inset:0;width:1920px;height:1080px;display:block}
#sub{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:1600px;padding:14px 46px 22px;border-radius:999px;background:rgba(255,255,255,.94);color:#2B2D42;font-size:58px;font-weight:800;line-height:1.35;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.12);visibility:hidden;border-radius:48px;width:max-content}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,20,40,.35);border:0;cursor:pointer;z-index:5}
#start span{width:180px;height:180px;border-radius:50%;background:#FFD23F;border:10px solid #2B2D42;font-size:90px;line-height:150px;color:#2B2D42;box-shadow:0 12px 0 #2B2D42;padding-left:18px}
#ui{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(760px,calc(100vw - 32px));display:none;align-items:center;gap:10px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.95);z-index:4;font-size:18px;color:#2B2D42;direction:ltr}
#ui button{border:0;background:#FFD23F;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none;color:#2B2D42}
#bar{position:relative;flex:1;height:14px;border-radius:7px;background:#e4e4ee;cursor:pointer;min-width:60px}
#fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:#FF9F1C;width:0}
#bar i{position:absolute;top:-3px;width:4px;height:20px;border-radius:2px;background:#2B2D42;opacity:.35}
#count{flex:none;min-width:48px;text-align:center}
#ttl{display:none}
@media (max-width:520px){#ui{gap:6px;padding:6px 8px}#ui button{width:34px;height:34px;font-size:15px}#count{display:none}}
body.record #ui,body.record #start{display:none!important}
body.record{cursor:none}
</style>
</head>
<body>
<div id="stage"><svg id="art" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg><div id="sub"></div></div>
<button id="start" aria-label="تشغيل"><span>▶</span></button>
<div id="ui"><button id="play">❚❚</button><button id="restart">↺</button><div id="bar"><div id="fill"></div></div><span id="count"></span><button id="mute">🔊</button><button id="full">⛶</button><span id="ttl"></span></div>

</script>
</body>
</html>
